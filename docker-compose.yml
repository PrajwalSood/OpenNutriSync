version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opennutrisync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opennutri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-opennutridb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opennutri}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: opennutrisync-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opennutri}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-opennutridb}
      API_SECRET_KEY: ${API_SECRET_KEY:-changeme_secret_token}
    ports:
      - "3000:3000"

volumes:
  pgdata:
